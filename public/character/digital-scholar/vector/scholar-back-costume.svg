<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 760" role="img" aria-label="甲骨文数字史官 背面与服装细节矢量稿">
  <defs>
    <linearGradient id="backBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1413"/>
      <stop offset="1" stop-color="#192421"/>
    </linearGradient>
    <linearGradient id="backRobe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#392a1d"/>
      <stop offset="0.5" stop-color="#2a2015"/>
      <stop offset="1" stop-color="#1a120c"/>
    </linearGradient>
  </defs>
  <rect width="420" height="760" fill="url(#backBg)"/>
  <circle cx="210" cy="340" r="200" fill="none" stroke="#b99656" stroke-opacity="0.07"/>
  <ellipse cx="210" cy="742" rx="150" ry="12" fill="#000" opacity="0.3"/>

  <g>
    <!-- 后发与冠 -->
    <path d="M154 300 C140 184 178 120 210 120 C242 120 280 184 266 300 L268 336 L152 336 Z" fill="#1d130d"/>
    <ellipse cx="210" cy="92" rx="34" ry="24" fill="#1d130d"/>
    <path d="M166 108 L254 84" stroke="#b99656" stroke-width="5" stroke-linecap="round"/>
    <path d="M204 116 h12 M206 126 h8" stroke="#d9bc8d" stroke-opacity="0.5" stroke-width="2"/>

    <!-- 袍服背面 -->
    <path d="M118 760 C120 520 152 360 182 306 L210 292 L238 306 C268 360 300 520 302 760 Z" fill="url(#backRobe)"/>
    <!-- 中缝与垂褶 -->
    <path d="M210 300 L210 760" stroke="#b99656" stroke-opacity="0.32" stroke-width="1.6"/>
    <path d="M160 400 C168 540 176 650 184 760 M260 400 C252 540 244 650 236 760" stroke="#000" stroke-opacity="0.18" stroke-width="2.5"/>
    <path d="M132 470 C138 570 148 670 158 760 M288 470 C282 570 272 670 262 760" stroke="#000" stroke-opacity="0.12" stroke-width="2"/>

    <!-- 领背与肩线 -->
    <path d="M170 310 Q210 292 250 310" fill="none" stroke="#b99656" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M146 332 Q210 306 274 332" fill="none" stroke="#8a6b3c" stroke-opacity="0.3" stroke-width="1.4"/>

    <!-- 宽袖后摆 -->
    <path d="M116 360 C92 460 84 600 92 760 L140 760 C132 620 138 480 166 392 Z" fill="#22170f"/>
    <path d="M304 360 C328 460 336 600 328 760 L280 760 C288 620 282 480 254 392 Z" fill="#22170f"/>
    <path d="M122 352 C104 440 96 590 102 740" stroke="#b99656" stroke-opacity="0.15" stroke-width="1.8"/>
    <path d="M298 352 C316 440 324 590 318 740" stroke="#b99656" stroke-opacity="0.15" stroke-width="1.8"/>

    <!-- 袖口暗纹甲骨象形：日/雨 -->
    <g fill="none" stroke="#c7a76c" stroke-opacity="0.35" stroke-width="1.6">
      <circle cx="112" cy="640" r="8"/><circle cx="112" cy="640" r="2"/>
      <path d="M112 628 v-5 M120 640 h5 M112 652 v5 M104 640 h-5"/>
      <path d="M290 640 h18 M294 632 v14 M300 630 v16 M306 632 v14"/>
    </g>

    <!-- 束腰背面 -->
    <rect x="150" y="560" width="120" height="20" rx="6" fill="#17100b" stroke="#b99656" stroke-opacity="0.35"/>
    <rect x="192" y="554" width="36" height="32" rx="4" fill="#8a6b3c"/>
    <path d="M202 570 h16 M210 562 v16" stroke="#17100b" stroke-width="2"/>

    <!-- 甲骨简牍与玉佩（背面垂挂） -->
    <rect x="294" y="590" width="20" height="72" rx="3" fill="#e4d9be" opacity="0.85"/>
    <g fill="none" stroke="#5b4630" stroke-width="1.7">
      <path d="M302 602 v10 M302 620 v8 M302 642 v10 M308 602 v12"/>
    </g>
    <circle cx="160" cy="604" r="10" fill="none" stroke="#9c8a67" stroke-width="3"/>
    <path d="M160 592 V 586" stroke="#9c8a67" stroke-width="2"/>
  </g>
</svg>
