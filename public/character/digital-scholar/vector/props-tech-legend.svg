  </defs>
  <rect width="600" height="420" fill="url(#propsBg)"/>
  <rect x="20" y="20" width="360" height="380" rx="10" fill="none" stroke="#b99656" stroke-opacity="0.3"/>
  <rect x="396" y="20" width="184" height="116" rx="10" fill="none" stroke="#b99656" stroke-opacity="0.25"/>
  <rect x="396" y="152" width="184" height="112" rx="10" fill="none" stroke="#b99656" stroke-opacity="0.25"/>
  <rect x="396" y="280" width="184" height="120" rx="10" fill="none" stroke="#b99656" stroke-opacity="0.25"/>

  <!-- 甲骨数字档案牌特写 -->
