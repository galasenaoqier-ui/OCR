<head>
<meta charset="utf-8">

<title>光痕唤文 · 甲骨文 Logo 动态加载系统</title>
<style>
  :root {
    /* 所有主要视觉与速度参数集中在这里。 */
    --paper:#f8f5e6; --ink:#13120f; --bronze:#9b793e; --gold:#dca757;
    --gold-soft:#c7964d; --muted:#746b5a; --line:#d9cfb8;
    --tour-ms:4800; --intro-ms:800; --finish-ms:1700;
    --glow-blur:3.2px; --glow-opacity:.64;
  }
  * { box-sizing:border-box }
  html { min-height:100%; background:var(--paper) }
  body { margin:0; min-height:100vh; color:var(--ink); font-family:system-ui,"Microsoft YaHei",sans-serif; background:radial-gradient(ellipse at 50% 31%,#fcf9ed 0%,#f8f5e6 67%,#f2eddb 100%) }
  main { min-height:100vh; width:min(100%,1040px); margin:auto; padding:clamp(16px,3vw,36px) 18px 28px; display:flex; flex-direction:column; align-items:center }
  .eyebrow { margin:0; color:#796646; letter-spacing:.34em; font-size:11px; font-weight:700 }
  h1 { margin:8px 0 4px; font:600 clamp(22px,3vw,31px)/1.28 Georgia,"Noto Serif CJK SC","SimSun",serif; letter-spacing:.12em }
  .subtitle { margin:0; color:var(--muted); font-size:12px; letter-spacing:.12em }
  #logo-root { width:min(70vw,620px); max-width:100%; aspect-ratio:1; position:relative; isolation:isolate; margin:clamp(2px,1.4vh,15px) auto -9px; overflow:hidden }
  #original-logo, #motion-svg { position:absolute; display:block; width:100%; height:100%; inset:0 }
  #original-logo { object-fit:contain; opacity:.15; will-change:opacity }
  #motion-svg { overflow:visible; pointer-events:none }
  .light-path { fill:none; stroke:var(--gold); stroke-linecap:round; stroke-linejoin:round; opacity:0; vector-effect:non-scaling-stroke }
  .base-trace { fill:none; stroke:var(--bronze); opacity:0; stroke-linecap:round; stroke-linejoin:round }
  .halo-path { fill:none; stroke:var(--gold); stroke-width:8; opacity:0; filter:url(#soft-glow) }
  .tour { stroke-width:4.5; filter:url(#light-glow) }
  .crack { stroke-width:2.5; filter:url(#light-glow) }
  .glyph { stroke-width:5; filter:url(#light-glow) }
  #spark, #core-pulse { fill:var(--gold); filter:url(#point-glow); opacity:0 }
  #spark { r:5 } #core-pulse { r:3 }
  .controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; width:100%; margin-top:2px }
  button { min-width:155px; min-height:46px; padding:10px 18px; border-radius:6px; border:1px solid var(--line); background:#fcf8ec; color:var(--ink); font:600 13px/1.3 inherit; letter-spacing:.06em; cursor:pointer; transition:background .2s,border-color .2s,transform .2s,box-shadow .2s }
  button:hover { background:#fffdf5; border-color:var(--bronze); transform:translateY(-1px) }
  button:focus-visible { outline:3px solid #9b793e; outline-offset:3px }
  button:active { transform:translateY(0) }
  button:disabled { opacity:.48; cursor:not-allowed; transform:none }
  #start { background:#344d46; border-color:#344d46; color:#f9f1df }
  #start:hover { background:#263d37 }
  #complete { border-color:#9b793e; color:#655023 }
  .status-row { min-height:29px; display:flex; align-items:center; gap:10px; justify-content:center; margin:16px 0 0; color:#6e634f; font-size:12px; letter-spacing:.1em }
  .status-dot { width:6px; height:6px; border-radius:50%; background:#b69a66; opacity:.5 }
  .status-dot.live { opacity:1; box-shadow:0 0 0 3px #d6ae6240 }
  .status-dot.done { background:#344d46; opacity:1; box-shadow:none }
  .rule { width:min(440px,72vw); height:1px; margin:16px 0 13px; background:linear-gradient(90deg,transparent,#c7b78f,transparent) }
  .caption { margin:0; color:#80735e; font:12px/1.65 Georgia,"SimSun",serif; letter-spacing:.08em; text-align:center }
  @media(max-width:600px){main{padding-top:24px}#logo-root{width:min(95vw,520px);margin:8px auto 1px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.controls button{min-width:0}#reset{grid-column:1/-1}.status-row{margin-top:12px}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:0ms!important;animation-duration:0ms!important}button:hover{transform:none}}
</style>

  const out=x=>1-Math.pow(1-clamp(x),3);
  const setOpacity=(el,value)=>{el.style.opacity=String(clamp(value))};
  const setDraw=(el,portion)=>{ const L=el.getTotalLength();el.style.strokeDasharray=`${L} ${L}`;el.style.strokeDashoffset=String(L*(1-clamp(portion))) };
  const trail=(el,progress,visible,width=.13)=>{const L=el.getTotalLength();el.style.strokeDasharray=`${L*width} ${L}`;el.style.strokeDashoffset=String(L*(1+width-progress*(1+2*width)));setOpacity(el,visible*Math.sin(Math.PI*clamp(progress))**.7)};
  const placeOn=(el,path,p)=>{const pt=path.getPointAtLength(path.getTotalLength()*clamp(p));el.setAttribute('cx',pt.x);el.setAttribute('cy',pt.y)};
  let mode='sleep', frame=0, stamp=0, elapsed=0, finishFrom=0, baseLogo=.15;
  function label(text,kind=''){status.textContent=text;dot.className='status-dot'+(kind?' '+kind:'')}
  function controls(){start.disabled=mode==='intro'||mode==='waiting'||mode==='finishing';complete.disabled=mode!=='intro'&&mode!=='waiting'}
  function cancel(){if(frame)cancelAnimationFrame(frame);frame=0;stamp=0}
  function clearMotion(){
    for(const a of arcs){setOpacity(a.base,0);setOpacity(a.trail,0)}
    for(const c of cracks)setOpacity(c,0);
    for(const g of glyphs)setOpacity(g,0);
    for(const s of symbols)setOpacity(s,0);
    setOpacity(edge,0);setOpacity(rim,0);setOpacity(spark,0);setOpacity(pulse,0);
    pulse.setAttribute('r','3');spark.setAttribute('r','5');
  }
  function sleep(){cancel();mode='sleep';elapsed=0;clearMotion();setOpacity(original,.15);label('沉睡 · 等待唤醒');controls()}
  function finishStatic(){cancel();mode='done';clearMotion();setOpacity(original,1);label('完成 · 原图定形','done');controls();window.__p2mReady=true}
  function paintIntro(t){
    const p=ease(t/CONFIG.intro);setOpacity(original,.15+p*.15);setOpacity(spark,Math.sin(Math.PI*p)*.85);spark.setAttribute('cy',String(177+p*84));
    for(const s of symbols)setOpacity(s,p*.08);setOpacity(edge,p*.10);
  }
  function paintWaiting(t){
    const phase=((t%CONFIG.tour)+CONFIG.tour)%CONFIG.tour/CONFIG.tour;
    setOpacity(original,.30+.05*Math.sin(phase*Math.PI*2));setOpacity(edge,.12+.13*ease(Math.sin(phase*Math.PI)**2));
    setOpacity(spark,0);setOpacity(pulse,0);
    arcs.forEach((a,i)=>{const local=phase*4-i;setOpacity(a.base,.10+.08*Math.sin(phase*Math.PI*2+i)**2);trail(a.trail,local,local>0&&local<1?.94:0,.19)});
    cracks.forEach((c,i)=>{const local=(phase-.08-i*.12+1)%1;trail(c,local,.72,.32)});
    glyphs.forEach((g,i)=>{const beat=(phase-i*.48+1)%1;setDraw(g,1);setOpacity(g,.08+.42*ease(Math.sin(Math.PI*beat)**2))});
    symbols.forEach((s,i)=>setOpacity(s,.08+.24*ease(Math.sin(phase*Math.PI*2-i*.62)**2)));
    setOpacity(rim,0);
  }
  function paintFinish(t){
    const p=clamp(t/CONFIG.finish), gather=ease(p/.25), flash=ease((p-.20)/.16)*(1-ease((p-.40)/.22));
    const reveal=ease((p-.31)/.39), quiet=ease((p-.67)/.33);
    setOpacity(original,baseLogo+(1-baseLogo)*reveal);
    arcs.forEach((a,i)=>{setOpacity(a.base,.15*(1-quiet));trail(a.trail,clamp(1-gather+i*.05),.75*(1-reveal),.22)});
    cracks.forEach((c,i)=>{setDraw(c,clamp((p-.02-i*.025)/.37));setOpacity(c,(.25+.5*flash)*(1-quiet))});
    glyphs.forEach((g,i)=>{setDraw(g,clamp((p-.03-i*.07)/.33));setOpacity(g,(.25+.48*flash)*(1-quiet))});
    symbols.forEach((s,i)=>setOpacity(s,(.18+.30*flash)*(1-quiet)));
    setOpacity(edge,(.24+.37*flash)*(1-quiet));
    setOpacity(pulse,flash*.96);pulse.setAttribute('r',String(3+flash*28));
    setOpacity(rim,.16*ease((p-.55)/.22)*(1-ease((p-.75)/.23)));
    setOpacity(spark,0);
  }
  function tick(now){
    if(!stamp)stamp=now;
    const dt=Math.min(90,Math.max(0,now-stamp));stamp=now;elapsed+=dt;
    if(mode==='intro'){
      paintIntro(elapsed);
      if(elapsed>=CONFIG.intro){mode='waiting';elapsed=0;label('巡游 · 光痕沿古纹流动','live');controls()}
    } else if(mode==='waiting')paintWaiting(elapsed);
    else if(mode==='finishing'){
      paintFinish(elapsed);
      if(elapsed>=CONFIG.finish){finishStatic();return}
    } else return;
    frame=requestAnimationFrame(tick)
  }
  function begin(){cancel();clearMotion();if(CONFIG.quiet.matches){finishStatic();return}mode='intro';elapsed=0;setOpacity(original,.15);label('蓄势 · 光点初现','live');controls();frame=requestAnimationFrame(tick)}
  function finish(){if(mode!=='intro'&&mode!=='waiting')return;cancel();baseLogo=parseFloat(original.style.opacity)||.3;mode='finishing';elapsed=0;label('定形 · 金光汇聚','live');controls();frame=requestAnimationFrame(tick)}
  start.addEventListener('click',begin);complete.addEventListener('click',finish);reset.addEventListener('click',sleep);
  CONFIG.quiet.addEventListener?.('change',()=>{if(CONFIG.quiet.matches)finishStatic();else sleep()});
  const query=new URLSearchParams(location.search);
  if(query.get('static')==='1'||CONFIG.quiet.matches)finishStatic();
  else if(query.has('t')){const t=Math.max(0,Number(query.get('t'))||0);mode='finishing';baseLogo=.3;paintFinish(t);if(t>=CONFIG.finish)finishStatic();else label('定形 · 定帧预览','live');window.__p2mReady=true;controls()}
  else {sleep();window.__p2mReady=true}
  if (query.get('autoplay') === '1' && !CONFIG.quiet.matches) {
    window.setTimeout(() => begin(), 60)
    window.setTimeout(() => finish(), 1560)
  }
})();
</script>
