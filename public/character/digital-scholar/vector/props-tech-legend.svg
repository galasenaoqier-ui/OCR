  <!-- 数字科技图例：扫描线 / 全息字符 / 粒子 -->
  <g transform="translate(488 340)">
    <path d="M-56 6 H56" stroke="#7fb5b0" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.8"/>
